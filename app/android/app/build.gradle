apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// One version for every build: app/package.json "version" (major.minor.patch) and its "versionCode", which must be
// major * 10000 + minor * 100 + patch (it is written out so that F-Droid's update check can read it).
def teulPackage = new JsonSlurper().parse(file('../../package.json'))
def teulVersion = teulPackage.version as String
def teulParts = teulVersion.tokenize('.-').take(3).collect { it.isInteger() ? it.toInteger() : 0 }
def teulVersionCode = teulParts[0] * 10000 + teulParts[1] * 100 + teulParts[2]
if (teulPackage.versionCode != teulVersionCode) {
    throw new GradleException("app/package.json: versionCode ${teulPackage.versionCode} does not match version ${teulVersion} (expected ${teulVersionCode})")
}

// The release key lives outside the repository (scripts/android-keystore.sh makes it).
def keystorePropsFile = file(System.getenv('TEUL_KEYSTORE_PROPERTIES') ?: "${System.getProperty('user.home')}/.teul-release/keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }

android {
    namespace = "com.teul.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.teul.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode teulVersionCode
        versionName teulVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreProps['storeFile']) signingConfig signingConfigs.release
            // the same APK from the same source wherever it is built (no git commit id inside it)
            vcsInfo.include = false
        }
    }
    // no Google-encrypted list of the dependencies in the APK's signing block (F-Droid and IzzyOnDroid flag it)
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

