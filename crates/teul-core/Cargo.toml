[package]
name = "teul-core"
license = "AGPL-3.0-or-later"
version = "0.1.0"
edition = "2021"
autotests = false

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", default-features = false }

[dev-dependencies]
tempfile = "3"

# One test program for all of tests/.
[[test]]
name = "all"
path = "tests/all.rs"
