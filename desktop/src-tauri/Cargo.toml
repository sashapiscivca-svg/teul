[package]
name = "teul-desktop"
version = "1.0.0"
description = "teul on the desktop"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "teul"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-dialog = "=2.8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "=0.22.1"
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust", "windows-native", "apple-native"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
